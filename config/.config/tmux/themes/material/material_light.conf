set -g @theme-variant 'material-light'
set -g @theme-bg '#fafafa'
set -g @theme-surface '#f0f0f0'
set -g @theme-surface-alt '#e0e0e0'
set -g @theme-text '#4a4a4a'
set -g @theme-muted '#777777'
set -g @theme-accent '#6182b8'
set -g @theme-accent-alt '#91b859'
set -g @theme-warning '#f7b93e'
set -g @theme-alert '#e53935'
set -g @theme-info '#39adb5'
set -g @theme-success '#91b859'
set -g status-style 'bg=#fafafa,fg=#4a4a4a'
set -g @theme-ready '1'
