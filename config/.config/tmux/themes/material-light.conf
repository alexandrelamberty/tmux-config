# ==============================================================================
# TMUX COMPONENT: Theme (Material Light)
# File: ~/.config/tmux/themes/material-light.conf
# Purpose: Bright companion palette with the same shared styling definitions.
# Notes: Publishes colours through @theme-* options and sets @theme-ready for layouts.
# ==============================================================================

# Palette --------------------------------------------------------------------
set -g @theme-variant 'material-light'
set -g @theme-bg '#f5f7ff'
set -g @theme-surface '#e4e7f2'
set -g @theme-surface-alt '#d7dae6'
set -g @theme-text '#1f2335'
set -g @theme-muted '#5c6076'
set -g @theme-accent '#3d5afe'
set -g @theme-accent-alt '#00897b'
set -g @theme-warning '#fb8c00'
set -g @theme-alert '#d81b60'
set -g @theme-info '#0081cb'
set -g @theme-success '#2e7d32'

# Status bar -----------------------------------------------------------------
set -g status-style "bg=#f5f7ff,fg=#1f2335"
set -g window-status-style "fg=#5c6076"
set -g window-status-current-style "fg=#3d5afe,bg=#d7dae6,bold"
set -g window-status-separator ''

# Panes and borders ----------------------------------------------------------
set -g pane-border-style "fg=#d7dae6"
set -g pane-active-border-style "fg=#3d5afe"
set -g display-panes-colour '#bfc3d2'
set -g display-panes-active-colour '#3d5afe'

# Command/message styling ----------------------------------------------------
set -g message-style "bg=#e4e7f2,fg=#1f2335"
set -g message-command-style "bg=#3d5afe,fg=#f5f7ff"
set -g mode-style "bg=#0081cb,fg=#f5f7ff"
set -g clock-mode-style 24

# Flags for layouts to detect whether a palette is loaded --------------------
set -g @theme-ready '1'
