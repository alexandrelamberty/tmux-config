
#
# Material Dark theme
# -------------------
# Provides the shared colour palette and base styling consumed by the
# layouts.  Every colour is also exported as an @theme-* user option so
# it can be re-used inside status lines or scripts without redefining
# values in multiple places.
#

# Palette --------------------------------------------------------------------
set -g @theme-variant 'material-dark'
set -g @theme-bg '#0f111a'
set -g @theme-surface '#191f2e'
set -g @theme-surface-alt '#1f2335'
set -g @theme-text '#c8d3f5'
set -g @theme-muted '#6f7390'
set -g @theme-accent '#82aaff'
set -g @theme-accent-alt '#c3e88d'
set -g @theme-warning '#ffcb6b'
set -g @theme-alert '#f07178'
set -g @theme-info '#89ddff'
set -g @theme-success '#c3e88d'

# Status bar -----------------------------------------------------------------
set -g status-style "bg=#0f111a,fg=#c8d3f5"
set -g window-status-style "fg=#6f7390"
set -g window-status-current-style "fg=#82aaff,bg=#1f2335,bold"
set -g window-status-separator ''

# Panes and borders ----------------------------------------------------------
set -g pane-border-style "fg=#1f2335"
set -g pane-active-border-style "fg=#82aaff"
set -g display-panes-colour '#34384f'
set -g display-panes-active-colour '#82aaff'

# Command/message styling ----------------------------------------------------
set -g message-style "bg=#1f2335,fg=#c8d3f5"
set -g message-command-style "bg=#82aaff,fg=#0f111a"
set -g mode-style "bg=#89ddff,fg=#0f111a"
set -g clock-mode-style 24

# Flags for layouts to detect whether a palette is loaded --------------------
set -g @theme-ready '1'
