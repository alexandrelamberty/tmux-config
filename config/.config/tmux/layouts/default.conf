# -----------------------------------------------------------------------------
# Layout visuals shared by all sessions
# NOTE: Source a theme file such as themes/material-dark.conf before this
# layout so that the @theme-* palette options referenced below are defined.
# -----------------------------------------------------------------------------

# Window / terminal titles ---------------------------------------------------
set -g set-titles on
set -g set-titles-string '#H · #S · #W(#I.#P) #T'

# Status bar placement -------------------------------------------------------
set -g status-position top
set -g status-justify centre
set -g status-left-length 80
set -g status-right-length 140

# Window listing -------------------------------------------------------------
#  #I - window index
#  #W - window title
#  #F - flags (* current, - last, M marked, etc.)
setw -g window-status-format '#[fg=#{@theme-muted}]#I #[fg=#{@theme-text}]#W #[fg=#{@theme-muted}]#F'
setw -g window-status-current-format '#[bg=#{@theme-surface-alt},fg=#{@theme-accent},bold] #I #[fg=#{@theme-text}]#W #[fg=#{@theme-accent-alt}]#{?window_zoomed_flag, ,}#[bg=default]'
setw -g window-status-activity-style 'bold'
setw -g window-status-bell-style 'fg=white,bg=red,bold'

# Status-left segments -------------------------------------------------------
# Prefix indicator + session + host information.
set -g status-left '#{?client_prefix,#[fg=#{@theme-alert}] ,#[fg=#{@theme-success}] }#[fg=#{@theme-accent}] #S #[fg=#{@theme-muted}] #[fg=#{@theme-text}]#H #[default]'

# Status-right segments ------------------------------------------------------
# Path of the focused pane, plugin status and date/time.
set -g status-right '#[fg=#{@theme-muted}]#{?pane_synchronized,󰓡 sync ,}#[fg=#{@theme-info}]#{pane_current_path} #[fg=#{@theme-muted}] #[fg=#{@theme-accent-alt}] #{continuum_status} #[fg=#{@theme-muted}] #[fg=#{@theme-text}]%Y-%m-%d #[fg=#{@theme-accent}]%H:%M #[default]'
