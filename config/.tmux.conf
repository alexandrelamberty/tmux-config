# ==============================================================================
# TMUX COMPONENT: Root configuration
# File: ~/.tmux.conf  (tracked at config/.tmux.conf)
# Purpose: Defines global behaviour, key bindings, pop-ups, and loads themes/layouts.
# Reference: https://github.com/tmux/tmux/wiki
# ==============================================================================

# -----------------------------------------------------------------------------
# Global options 
# -----------------------------------------------------------------------------

#set-option -a terminal-overrides ",*256col*:RGB"
set-option -sa terminal-overrides ",alacritty*:Tc"
set -g default-terminal "tmux-256color"
# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0
set -g status-interval 5
set -g base-index 1
set -gw pane-base-index 1
set -g renumber-windows on
set -s escape-time 10 # faster command sequences
set -sg repeat-time 600 # increase repeat timeout
set -s focus-events on
set -q -g status-utf8 on # expect UTF-8 (tmux < 2.2)
set -g history-limit 5000 # Increase scrollback buffer size
setw -q -g utf8 on
setw -g mode-keys vi
setw -g xterm-keys on
# For "grouped sessions" and multi-monitor setup (https://github.com/tmux-plugins/tmux-sensible)
setw -g aggressive-resize on

# -----------------------------------------------------------------------------
# Keybindings
# -----------------------------------------------------------------------------

set -g prefix C-Space
unbind-key C-b
bind-key C-Space send prefix

# Session navigation
bind Tab switch-client -l # move to last session

# Window navigation
# bind C-l next-window
# bind C-h previous-window
bind C-p previous-window
bind C-n next-window
bind Space last-window

# Pane splitting
bind H split-window -h
bind V split-window -v

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane closing without warning
bind X kill-pane

# Reload configuration
bind R source-file ~/.tmux.conf \; display-message "  Configuration reloading..."

# Copy mode
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard && notify-send "Selection clipped"'


# -----------------------------------------------------------------------------
# Pop-ups 
# -----------------------------------------------------------------------------

# Search
bind C-f display-popup -E "find ~/notes | fzf --reverse | xargs -r tmux split-window -d 'nvim'"

# Execute NPM scripts
# FIXME. Change to generic script for handling running NPM and Make.
bind C-x display-popup -E "echo hello | xargs -r tmux split-window -d 'nvim'"

# Theme switcher popup
bind C-t display-popup -w 60% -h 60% -E "$HOME/.config/tmux/scripts/switch-theme.sh"

# Layout switcher popup
bind C-l display-popup -w 60% -h 60% -E "$HOME/.config/tmux/scripts/switch-layout.sh"

# -----------------------------------------------------------------------------
# Visuals
# -----------------------------------------------------------------------------

# Allow overriding the theme via $TMUX_THEME (e.g. export TMUX_THEME=material-light).
if-shell '[ -n "$TMUX_THEME" ] && [ -f "$HOME/.config/tmux/themes/${TMUX_THEME}.conf" ]' \
	"source-file \"$HOME/.config/tmux/themes/${TMUX_THEME}.conf\"" \
	"source-file ~/.config/tmux/themes/material-dark.conf"

source-file ~/.config/tmux/layouts/default.conf

# ------------------------------------------------------------------------------
# Hooks
# ------------------------------------------------------------------------------

# TODO Check popup to change status bar like in full screen or not,
# Automate the change of status when switching to full screen
set-hook -g window-linked 'if -F "#{==:#{continuum_status},1}" "set -g status off" "set -g status on"'
set-hook -g window-unlinked 'if -F "#{==:#{continuum_status},1}" "set -g status off" "set -g status on"'

# ------------------------------------------------------------------------------
# Plugins
# ------------------------------------------------------------------------------

# Auto install TPM and install plugins
if "test ! -d ~/.tmux/plugins/tpm" \
	"run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Plugins list
set -g @plugin 'tmux-plugins/tpm'									 # Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tmux-resurrect'			 # Save and restore tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'			 # Save and restore tmux sessions

# Resurrect options
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Continuum options
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-save-interval '10'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
